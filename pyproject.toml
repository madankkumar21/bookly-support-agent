[project]
name = "bookly-agent"
version = "0.1.0"
description = "Bookly customer-support agent: the model talks, code decides, the customer confirms."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
