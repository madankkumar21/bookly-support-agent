[project]
name = "bookly-agent"
version = "0.1.0"
description = "Bookly customer-support agent: the AI handles the conversation, code decides every refund, the customer confirms."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "SIM", "E741"]
ignore = ["E501"]  # a few long table-like lines read better unwrapped

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # pytest asserts
