<html lang="en" data-theme="light">

<title>Bookly Support</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f3ee; --panel: #ffffff; --ink: #1f2328; --muted: #6b6f76; --line: #e3ddd3;
    --brand: #1f5f4a; --brand-ink: #ffffff; --me: #e7efe9; --model: #2f6fd6; --code: #3b4350; --code-bg: rgba(27,36,48,.06);
    --ok: #1e7d4f; --bad: #b3261e; --warn: #9a6400; --card: #fff8e8; --card-line: #e8cf8f; --jev: #6b3fb8;
    --handoff: #b7791f; --handoff-bg: #fdf4e1; --handoff-ink: #7a4f0e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {

      --brand: #3f9b7a; --brand-ink: #0d1411; --me: #22302a; --model: #7aa7ff; --code: #c9d0d8; --code-bg: rgba(232,230,227,.08);

    }
  }

  header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 8px; } header h1 span { color: var(--brand); }
  header h1 svg { width: 22px; height: 22px; color: var(--brand); flex: none; }
  .tagline { font-size: 13px; color: var(--muted); }
  .bot-row { display: flex; align-items: flex-end; gap: 8px; align-self: flex-start; max-width: 100%; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; justify-content: center; flex: none; }
  .avatar svg { width: 15px; height: 15px; }
  main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; padding: 16px; max-width: 1200px; margin: 0 auto; height: calc(100vh - 54px); }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; min-height: 0; }
  .chat-log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 82%; padding: 9px 12px; border-radius: 12px; white-space: pre-wrap; }
  .bot { background: var(--bg); border: 1px solid var(--line); align-self: flex-start; border-top-left-radius: 4px; }
  .me { background: var(--me); align-self: flex-end; border-top-right-radius: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-self: flex-start; }
  .chip { border: 1px solid var(--brand); color: var(--brand); background: transparent; border-radius: 999px; padding: 4px 11px; font: inherit; font-size: 14px; cursor: pointer; }
  .chip:hover { background: var(--brand); color: var(--brand-ink); }
  .card { align-self: flex-start; max-width: 88%; border: 1px solid var(--card-line); background: var(--card); border-radius: 12px; padding: 12px; }
  .card h3 { margin: 0 0 6px; font-size: 14px; } .card .terms { color: var(--muted); font-size: 13.5px; margin: 6px 0 10px; }
  .card .row { font-size: 14px; } .card button { margin-right: 8px; }
  .btn { border: 0; border-radius: 8px; padding: 7px 14px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); } .btn.ghost { background: transparent; border: 1px solid var(--muted); color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  .composer { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  .composer textarea { flex: 1; resize: none; border: 1px solid var(--muted); border-radius: 10px; padding: 9px 11px; font: inherit; background: var(--bg); color: var(--ink); height: 42px; }
  .composer textarea::placeholder { color: var(--muted); opacity: 1; }
  .typing { color: var(--muted); font-size: 13px; align-self: flex-start; }
  .panel-head { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .panel-head h2 { font-size: 14px; margin: 0 0 4px; }
  .legend { font-size: 13px; color: var(--muted); } .legend b.m { color: var(--model); } .legend b.c { color: var(--code); } .legend b.ok { color: var(--ok); } .legend b.bad { color: var(--bad); }
  .trace { flex: 1; overflow-y: auto; padding: 10px 14px; font: 13.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .turn { margin: 10px 0 4px; color: var(--muted); font-weight: 600; font-family: -apple-system, sans-serif; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .ev { padding: 2px 0 2px 8px; border-left: 2px solid var(--line); margin: 2px 0; word-break: break-word; }
  .ev.model { color: var(--model); border-color: var(--model); }
  .ev.code { color: var(--code); border-color: var(--code); background: var(--code-bg); border-radius: 0 4px 4px 0; padding-right: 6px; }
  .ev.ok { color: var(--ok); border-color: var(--ok); } .ev.bad { color: var(--bad); border-color: var(--bad); } .ev.warn { color: var(--warn); border-color: var(--warn); }
  .ev.dim { color: var(--muted); opacity: .75; border-color: transparent; font-size: 12px; }
  .ev.jev { color: var(--jev); border-color: var(--jev); } .legend b.j { color: var(--jev); }
  .storebar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .storebar[hidden], .systems[hidden] { display: none; }  /* store off: the display rules above must not un-hide these */
  .storebar .btn { padding: 4px 10px; font-size: 13px; font-weight: 500; } .storebar .today { margin-right: 4px; color: var(--ink); }
  .systems h3 { font-size: 12px; margin: 8px 0 2px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .note { align-self: center; color: var(--muted); font-size: 13px; text-align: center; padding: 4px 10px; border: 1px dashed var(--line); border-radius: 8px; }
  /* Staff handoff (BOOKLY_RESHIP=1, priority reship only): one accent for the ticket card and the chat note. */
  .systems div.rec.handoff { margin: 6px 0; padding: 8px 10px; border: 1px solid var(--line); border-left: 4px solid var(--handoff); border-radius: 6px; background: var(--handoff-bg); scroll-margin: 12px; }
  .handoff .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; color: var(--handoff-ink); margin-bottom: 2px; }
  .handoff .hd { font-weight: 700; } .handoff .meta { color: var(--muted); font-size: 12px; }
  .handoff .lbl { font-weight: 600; color: var(--handoff-ink); margin-top: 4px; } .handoff ul { margin: 0; padding-left: 18px; }
  .note.handoff { color: var(--ink); background: var(--handoff-bg); border: 1px solid var(--handoff); border-left-width: 4px; }
  .note.handoff b { color: var(--handoff-ink); }
  .systems { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 13px; max-height: 32%; overflow-y: auto; }
  .systems:has(div.handoff) { max-height: 48%; }  /* room for the whole handoff card, down to its Staff replied button */
  .systems h2 { font-size: 13px; margin: 0 0 6px; } .systems .empty { color: var(--muted); }
  .systems div.rec { padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .systems textarea.staff-reply { display: block; width: 100%; margin-top: 6px; height: 54px; resize: vertical; border: 1px solid var(--muted); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; background: var(--bg); color: var(--ink); }
  details.help { font-size: 13px; color: var(--muted); align-self: flex-start; max-width: 90%; }
  details.help code { font-size: 13px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; height: auto; } section.chat { height: 72vh; } section.hood { height: 70vh; } .tagline { display: none; } }
</style>
</head>
<body>
<header>
  <h1><svg viewBox="0 1.5 24 24" aria-hidden="true"><path d="M3 5h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5v13h-5a4 4 0 0 0-4 4 4 4 0 0 0-4-4H3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v13" stroke="currentColor" stroke-width="2"/></svg><span>Bookly</span> Support</h1>
  <span class="tagline">Orders · Returns · Shipping · Account</span>
</header>
<main>
  <section class="chat">
    <div class="chat-log" id="log"></div>
    <form class="composer" id="form">
      <textarea id="input" placeholder="Type a message…" autocomplete="off"></textarea>
      <button class="btn primary" type="submit" id="send">Send</button>
    </form>
  </section>
  <section class="hood">
    <div class="panel-head">
      <h2>Behind the reply</h2>
      <div class="legend" id="legend"><b class="m">Blue</b> = the AI decided · <b class="c">Grey</b> = Bookly’s rules decided · <b class="ok">Green</b> = refund allowed · <b class="bad">Red</b> = refund blocked</div>
      <div class="storebar" id="storebar" hidden>
        <span class="today" id="today"></span>
        <button class="btn ghost" type="button" id="newchat">New conversation, same store</button>
        <button class="btn ghost" type="button" data-days="1">+1 day</button>
        <button class="btn ghost" type="button" data-days="8">+8 days</button>
        <button class="btn ghost" type="button" id="resetstore">Reset store</button>
      </div>
    </div>
    <div class="trace" id="trace"><div class="ev dim">Every lookup, policy decision and confirmation shows here, turn by turn.</div></div>
    <div class="systems" id="systems"></div>
    <div class="systems" id="store" hidden></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let sessionId = null, busy = false;

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function scroll(node) { node.scrollTop = node.scrollHeight; }

const BOOK_MARK = '<svg viewBox="0 1.5 24 24" aria-hidden="true"><path d="M3 5h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5v13h-5a4 4 0 0 0-4 4 4 4 0 0 0-4-4H3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 9v13" stroke="currentColor" stroke-width="2.2"/></svg>';

// The model sometimes marks a book title as **bold**. Show it as bold text. Each piece goes in as a text node or
// a <strong> holding text, never as innerHTML, so nothing in a reply can become markup.
function setReply(node, text) {
  node.textContent = "";
  String(text).split(/(\*\*[^*\n]+\*\*)/).forEach((part) => {
    const bold = /^\*\*([^*\n]+)\*\*$/.exec(part);
    node.appendChild(bold ? el("strong", null, bold[1]) : document.createTextNode(part));
  });
}

function addMsg(text, who) {
  const m = el("div", "msg " + who, who === "bot" ? null : text);
  if (who === "bot") {  // the assistant gets a small book avatar; its text goes in through setReply
    setReply(m, text);
    const row = el("div", "bot-row"), avatar = el("div", "avatar");
    avatar.innerHTML = BOOK_MARK;
    row.appendChild(avatar); row.appendChild(m); $("log").appendChild(row);
  } else {
    $("log").appendChild(m);
  }
  scroll($("log"));
  return m;
}

function addChips(options, onPick) {
  const wrap = el("div", "chips");
  options.forEach((o) => { const b = el("button", "chip", o); b.type = "button"; b.onclick = () => { wrap.remove(); onPick(o); }; wrap.appendChild(b); });
  $("log").appendChild(wrap); scroll($("log"));
}

function addCard(c) {
  // Only the newest card is live: older cards are disabled so they can never confirm newer terms.
  document.querySelectorAll(".card button").forEach((b) => { b.disabled = true; });
  const card = el("div", "card");
  card.appendChild(el("h3", null, "Please confirm"));
  card.appendChild(el("div", "row", `${c.items.join(", ")} · ${c.reason}`));
  card.appendChild(el("div", "row", `Amount: ${c.amount}`));
  card.appendChild(el("div", "terms", c.terms));
  const yes = el("button", "btn primary", "Confirm"), no = el("button", "btn ghost", "Cancel");
  yes.type = no.type = "button";
  const done = (button) => { yes.disabled = no.disabled = true; send("", button, c.quote_id); };
  yes.onclick = () => done("confirm"); no.onclick = () => done("cancel");
  card.appendChild(yes); card.appendChild(no);
  $("log").appendChild(card); scroll($("log"));
}

function fmtArgs(input) { return Object.entries(input || {}).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(", "); }

function resultLine(tool, r) {
  if (tool === "get_order") return r.status + (r.order ? ` · ${r.order.status}` : "") + (r.customer_record ? ` · customer record ${r.customer_record.status}` : "");
  if (tool === "recommend_books") return r.status + (r.picks ? ` · ${r.picks.map((p) => p.title).join(", ")}` : "");
  if (tool === "check_return_eligibility") {
    if (r.status === "blocked") return "blocked: " + r.reason;
    if (r.decision === "needs_input") return `needs_input (${r.field})`;
    if (r.decision === "ineligible") return `ineligible (${r.reason_code})`;
    if (r.decision === "needs_human") return `needs_human ($${r.amount} over limit)`;
    return `${r.decision} · $${r.amount} · terms ${r.quote_id}`;
  }
  if (tool === "create_return") return r.status + (r.rma_id ? ` · ${r.rma_id} / ${r.refund_id}` : r.reason ? ` · ${r.reason}` : "");
  if (tool === "search_policy") return `${(r.passages || []).length} passage(s) ${(r.passages || []).map((p) => p.id).join(", ")}`;
  if (tool === "handoff_to_human") return `queued · ${r.ticket_id}`;
  return r.status || JSON.stringify(r);
}

// The allowed reason in plain words; blocked reasons pass through as the gate wrote them.
function plainReason(reason) {
  return reason === "verified, latest quote, eligible, under cap, confirmed by customer"
    ? "order verified, current terms, eligible, under the approval limit, customer confirmed" : reason;
}

// The intent router's decision (router on only): which procedures this turn added to the prompt.
function routeLine(e) {
  const added = e.procedures && e.procedures.length ? `loaded ${e.procedures.join(", ")}` : "nothing new to load";
  if (e.skipped) return `router skipped (card button) · ${added}`;
  if (e.fallback) return `router unsure${e.route_error ? " (" + e.route_error + ")" : ` (${(e.confidence ?? 0).toFixed(2)})`} → all procedures · ${added}`;
  return `router: ${e.intents.join(" + ")} (${e.confidence.toFixed(2)}) · ${added}`;
}

// One Jev call: what it was asked, the probabilities it gave, and what code decided with them.
function jevLine(e) {
  if (e.jev_error) return `Jev · ${e.purpose} · unavailable (${e.jev_error}) → code: ${e.decision}`;
  const answers = Object.entries(e.answers || {}).map(([k, v]) => `${k} ${Number(v).toFixed(2)}`).join(", ");
  const about = e.mission_id ? ` ${e.mission_id}` : "";
  const state = e.to_status ? ` → ${e.to_status}` : "";
  return `Jev · ${e.purpose}${about} · ${answers || "not asked"} → code: ${e.decision}${state}${e.latency_ms ? ` · ${e.latency_ms} ms` : ""}`;
}

// The store panel (store on only): what outlives a conversation.
function renderStore(s) {
  if (!s) return;
  storeOn = true;
  const box = $("store"); box.hidden = false; box.innerHTML = "";
  $("storebar").hidden = false; $("today").textContent = `Today: ${s.today}`;
  box.appendChild(el("h2", null, "The store: what outlives a conversation"));
  if (jevOff) box.appendChild(el("div", "rec", "Jev unavailable: judgments are skipped. No TYPESAFE_API_KEY was found, so tastes are not saved, typed follow-up answers are not read, and the mood stays unknown. Add the key to .env and restart the server."));
  box.appendChild(el("h3", null, "Customer memory (genre keys, never the customer’s words)"));
  const memory = Object.entries(s.memory);
  if (!memory.length) box.appendChild(el("div", "empty", "Nothing saved yet."));
  memory.forEach(([email, m]) => box.appendChild(el("div", "rec", `${email} · likes ${m.likes.join(", ") || "none"} · dislikes ${m.dislikes.join(", ") || "none"}`)));
  box.appendChild(el("h3", null, "Follow-ups"));
  if (!s.follow_ups.length) box.appendChild(el("div", "empty", "None open."));
  s.follow_ups.forEach((m) => box.appendChild(el("div", "rec", `${m.mission_id} · ${m.subject} · ${m.status}${m.status === "scheduled" ? ` · due ${m.due_on}` : ""}${m.ticket_id ? ` · ${m.ticket_id}` : ""}`)));
  box.appendChild(el("h3", null, "Last contact (what code did, and the mood Jev read; never the customer’s words)"));
  const contacts = Object.entries(s.contacts || {});
  if (!contacts.length) box.appendChild(el("div", "empty", "No verified customer has been in touch yet."));
  contacts.forEach(([email, c]) => box.appendChild(el("div", "rec", `${email} · ${c.on} · ended: ${c.ended}${c.ticket_id ? ` (${c.ticket_id})` : ""} · mood ${c.mood} · gave up: ${c.gave_up} · said solved: ${c.said_solved}`)));
  box.appendChild(el("h3", null, "Outbox (simulated email)"));
  if (!s.outbox.length) box.appendChild(el("div", "empty", "Nothing sent yet."));
  s.outbox.forEach((o) => box.appendChild(el("div", "rec", `${o.sent_on} → ${o.to}: ${o.text}`)));
}

let storeOn = false;
let jevOff = false;  // store on, and the server has no TypeSafe key
let lastTurn = 0;
function renderTrace(events, latency) {
  const t = $("trace");
  if (lastTurn === 0) t.innerHTML = "";
  const turn = events.length ? events[0].turn : lastTurn + 1;
  lastTurn = turn;
  t.appendChild(el("div", "turn", `Turn ${turn}`));
  events.forEach((e) => {
    let cls = "code", txt = "";
    if (e.kind === "confirmation") { cls = e.signal === "confirm" ? "ok" : "warn"; txt = `customer's reply to the card, read by code: ${e.signal} (${e.source})`; }
    else if (e.kind === "route") { cls = "model"; txt = routeLine(e); }
    else if (e.kind === "tool_call") { cls = "model"; txt = `→ ${e.tool}(${fmtArgs(e.input)})`; }
    else if (e.kind === "tool_result") { cls = e.result && e.result.status === "blocked" ? "bad" : "code"; txt = `← ${resultLine(e.tool, e.result || {})}`; }
    else if (e.kind === "gate") { cls = e.allowed ? "ok" : "bad"; txt = `final check · refund ${e.allowed ? "ALLOWED" : "BLOCKED"} · ${plainReason(e.reason)}`; }
    else if (e.kind === "card_shown") { cls = "warn"; txt = `confirmation card shown · ${e.quote_id} (built by code from the terms)`; }
    else if (e.kind === "claim_check") { cls = "bad"; txt = "claim check replaced a reply that claimed an unbacked refund"; }
    else if (e.kind === "jev") { cls = e.jev_error ? "bad" : "jev"; txt = jevLine(e); }
    else if (e.kind === "return_contact") { cls = "code"; txt = `last contact, read by code: ended ${e.ended} · mood ${e.mood} · gave up ${e.gave_up} → ${e.decision}`; }
    else if (e.kind === "reship") { cls = "code"; txt = `reship, decided by code · ${e.order_id}${e.checks ? " · " + Object.entries(e.checks).map(([k, v]) => `${k} ${v ? "yes" : "NO"}`).join(", ") : ""} → ${e.decision}`; }
    else if (e.kind === "follow_up") { cls = "code"; txt = `follow-up ${e.mission_id} → ${e.to_status} · ${e.decision}`; }
    else if (e.kind === "follow_up_button") { cls = "code"; txt = `follow-up ${e.mission_id}: button read by code → ${e.decision} → ${e.to_status}`; }
    else if (e.kind === "recommend_check") { cls = "bad"; txt = `reply named a book the system did not hand over (${(e.titles || []).join(", ")}); code replaced it`; }
    else if (e.kind === "api_call") { cls = "dim"; txt = `${e.model} · ${e.stop_reason} · ${e.latency_ms} ms`; }
    else if (e.kind === "api_error" || e.kind === "tool_error") { cls = "bad"; txt = e.kind; }
    else return;
    t.appendChild(el("div", "ev " + cls, txt));
  });
  if (latency) t.appendChild(el("div", "ev dim", `turn latency ${latency} ms`));
  scroll(t);
}

// The staff handoff card for a priority reship_followup ticket. Every line comes from the ticket's payload.
function handoffCard(tk, h) {
  const card = el("div", "rec handoff");
  card.appendChild(el("div", "tag", "HANDOFF TO STAFF"));
  card.appendChild(el("div", "hd", h.header));
  card.appendChild(el("div", "meta", `Ticket ${tk.ticket_id} · opened ${tk.opened_on || "?"} by code · ${tk.answered_on ? `a person replied ${tk.answered_on}${tk.staff_reply ? `: "${tk.staff_reply}"` : ""}` : "no reply yet"}`));
  card.appendChild(el("div", "lbl", "Contacts"));
  const ul = el("ul"); (h.contacts || []).forEach((c) => ul.appendChild(el("li", null, c))); card.appendChild(ul);
  card.appendChild(el("div", "lbl", "Done")); card.appendChild(el("div", null, h.done));
  card.appendChild(el("div", "lbl", "Next")); card.appendChild(el("div", null, h.next));
  return card;
}

// A system note in the chat, written by code. kind "handoff" uses the handoff accent; others stay grey.
function addNote(n) {
  if (typeof n === "string") { $("log").appendChild(el("div", "note", n)); return; }
  const note = el("div", "note" + (n.kind === "handoff" ? " handoff" : ""));
  if (n.label) note.append(el("b", null, (n.kind === "handoff" ? "↪ " : "") + n.label), " · ");
  note.append(n.text);
  $("log").appendChild(note); scroll($("log"));
}

function renderSystems(s) {
  const box = $("systems"); box.innerHTML = "";
  box.appendChild(el("h2", null, "Bookly’s systems (simulated)"));
  const rr = s.reship_requests || [], rs = s.reships || [];  // BOOKLY_RESHIP=1 only
  if (!s.returns.length && !s.tickets.length && !s.password_resets.length && !rr.length) { box.appendChild(el("div", "empty", "No returns, tickets or resets yet.")); return; }
  rr.forEach((r) => box.appendChild(el("div", "rec", `Reship request ${r.request_id} · ${r.order_id} · ${r.reason_code} · written by code ${r.requested_on}${r.priority ? " · PRIORITY" : ""} · ${r.status}${r.reship_id ? ` → ${r.reship_id}` : ""}`)));
  rs.forEach((r) => box.appendChild(el("div", "rec", `Reship ${r.reship_id} · ${r.order_id} · done ${r.done_on} in the order console`)));
  s.returns.forEach((r) => box.appendChild(el("div", "rec", `Return ${r.rma_id} · refund ${r.refund_id} · $${r.amount.toFixed(2)} · ${r.reason} · ${r.resolution}`)));
  s.tickets.forEach((tk) => {
    const h = tk.payload.handoff;  // priority reship_followup only: a summary code built from stored facts
    const row = h ? handoffCard(tk, h) : el("div", "rec", `Ticket ${tk.ticket_id} · ${tk.reason_code}${tk.payload.priority ? " · PRIORITY" : ""} · ${tk.payload.identity || "opened by the system"}${storeOn ? ` · opened ${tk.opened_on || "?"} · ${tk.answered_on ? `a person replied ${tk.answered_on}${tk.staff_reply ? `: "${tk.staff_reply}"` : ""}` : tk.escalated_to ? `taken over by ${tk.escalated_to}` : "no reply yet"}` : ""}`);
    if (storeOn && !tk.answered_on && !tk.escalated_to) {  // simulated staff: the proof that a person answered
      // Optional reply text: empty keeps the one-click "a person replied" fact; text is stored on the ticket.
      const reply = el("textarea", "staff-reply"); reply.id = `reply-${tk.ticket_id}`; reply.maxLength = 2000;
      reply.placeholder = `Staff reply to ${tk.ticket_id} (optional)`; reply.setAttribute("aria-label", `Staff reply to ${tk.ticket_id}`);
      const b = el("button", "btn ghost", "Staff replied"); b.type = "button"; b.style.marginTop = "6px";
      b.onclick = async () => {
        b.disabled = true;
        const res = await fetch("/api/ticket/answer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ ticket_id: tk.ticket_id, reply: reply.value }) });
        b.disabled = false;
        if (res.ok) { const d = await res.json(); renderSystems(d.systems); renderStore(d.store); }
      };
      row.appendChild(reply); row.appendChild(b);
    }
    box.appendChild(row);
  });
  s.password_resets.forEach((e) => box.appendChild(el("div", "rec", `Password reset requested · ${e}`)));
}

async function send(text, button, quoteId) {
  if (busy || !sessionId) return;
  if (!text.trim() && !button) return;
  busy = true; $("send").disabled = true;
  addMsg(button ? (button === "confirm" ? "✓ Confirmed" : "✕ Cancelled") : text, "me");
  const typing = el("div", "typing", "Bookly is typing…"); $("log").appendChild(typing); scroll($("log"));
  try {
    const res = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: sessionId, text, button, quote_id: quoteId || null }) });
    if (!res.ok) { let m = await res.text(); try { m = JSON.parse(m).detail || m; } catch (e) {} throw new Error(m); }
    const d = await res.json();
    typing.remove();
    addMsg(d.reply, "bot");
    (d.notes || []).forEach(addNote);  // written by code, not the model
    if (d.options && d.options.length) addChips(d.options, (o) => send(o));
    if (d.card) addCard(d.card);
    renderTrace(d.events, d.latency_ms);
    renderSystems(d.systems);
    renderStore(d.store);
  } catch (err) {
    typing.remove(); addMsg(err.message, "bot");
  } finally { busy = false; $("send").disabled = false; $("input").focus(); }
}

$("form").onsubmit = (e) => { e.preventDefault(); const v = $("input").value; $("input").value = ""; send(v); };
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });

async function startConversation() {
  const r = await fetch("/api/session", { method: "POST" });
  const d = await r.json();
  if (!r.ok) { addMsg(d.detail || "Could not start a session.", "bot"); return; }
  sessionId = d.session_id;
  storeOn = !!d.store;
  jevOff = storeOn && d.jev_ready === false;
  addMsg("Hi! I'm Bookly's assistant. I can check on an order, help with a return or refund, or answer questions about shipping and our policies.", "bot");
  addChips(["My order is messed up", "Where is my order?", "Do you ship to Canada?", "I forgot my password"].concat(storeOn ? ["Recommend me a book"] : []), (o) => send(o));
  const help = el("details", "help");
  help.innerHTML = `<summary>Test accounts</summary>
    <code>BK-1001 maya.chen@example.com</code> damaged book, delivered 4 days ago<br>
    <code>BK-1002 dan.ortiz@example.com</code> three books, delivered 12 days ago<br>
    <code>BK-1003 priya.nair@example.com</code> delivered 31 days ago<br>
    <code>BK-1005 jordan.blake@example.com</code> ebook, downloaded<br>
    <code>BK-1007 elena.rossi@example.com</code> $129.99 box set<br>
    <code>BK-1008 marcus.webb@example.com</code> delivered 90 days ago<br>
    <code>BK-1009 aisha.khan@example.com</code> in transit<br>
    <code>BK-1010 tom.becker@example.com</code> delivered 20 days ago<br>
    <code>BK-1013 nina.patel@example.com</code> late, probably lost`;
  $("log").appendChild(help);
  renderSystems(d.systems || { returns: [], tickets: [], password_resets: [] });
  if (storeOn) {
    renderStore(d.store);
    if (!$("legend").querySelector(".j")) { const j = el("b", "j", "Purple"); $("legend").append(" · ", j, " = Jev judged, code decided"); }
  }
}

// Store on only. A new conversation keeps the store; a tick moves the shared clock and runs the follow-up check.
function resetPage(note) {
  $("log").innerHTML = ""; $("trace").innerHTML = ""; lastTurn = 0;
  if (note) $("trace").appendChild(el("div", "ev dim", note));
}
$("newchat").onclick = async () => { if (busy) return; resetPage("New conversation. The store on the right is unchanged."); await startConversation(); };
$("resetstore").onclick = async () => {
  if (busy) return;
  await fetch("/api/store/reset", { method: "POST" });
  resetPage("Store reset."); await startConversation();
};
document.querySelectorAll("#storebar [data-days]").forEach((b) => {
  b.onclick = async () => {
    if (busy) return;
    const res = await fetch("/api/tick", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ days: Number(b.dataset.days) }) });
    if (!res.ok) return;
    const d = await res.json();
    renderSystems(d.systems); renderStore(d.store);
    const sent = d.events.filter((e) => e.event === "asked").length;
    $("log").appendChild(el("div", "note", `${b.dataset.days} day(s) later. Today is ${d.store.today}.${sent ? ` Bookly sent ${sent} follow-up email(s): see the outbox.` : ""}`));
    scroll($("log"));
  };
});

startConversation();
</script>
</body>
</html>
