  - {id: P08, purchased: ["Educated"], candidate: "Fourth Wing", expect: no}
  - {id: P09, purchased: ["The Midnight Library"], candidate: "A Man Called Ove", expect: yes, hard: true}
  - {id: P10, purchased: ["Sapiens"], candidate: "The Body", expect: yes}
  - {id: P11, purchased: ["Sapiens"], candidate: "The Seven Husbands of Evelyn Hugo", expect: no}
