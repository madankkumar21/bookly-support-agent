# Added 2026-11-14 with bookly/contact.py. Each text is a customer's last message in a conversation.
mood:
  - {id: M01, text: "OK, thanks anyway.", mood: calm, expect: [none]}
  - {id: M02, text: "Thanks, that answers my question.", mood: calm, expect: [none]}
  - {id: M03, text: "Could you check where order BK-1004 is?", mood: calm, expect: [none]}
  - {id: M04, text: "No problem, I'll keep the book then.", mood: calm, expect: [none]}
  - {id: M05, text: "Got it. Have a good day.", mood: calm, expect: [none]}
  - {id: M06, text: "I understand the policy. Thank you for explaining.", mood: calm, expect: [none]}
  - {id: M07, text: "That's disappointing. I expected a refund.", mood: concerned, expect: [acknowledge]}
  - {id: M08, text: "I'm a bit worried, the package is a week late.", mood: concerned, expect: [acknowledge]}
  - {id: M09, text: "Honestly, this is not what I hoped to hear.", mood: concerned, expect: [acknowledge]}
  - {id: M10, text: "I'm not happy about this, but fine. What are my options?", mood: concerned, expect: [acknowledge]}
  - {id: M11, text: "This is absolutely ridiculous. I want my money back NOW.", mood: angry, expect: [early_escalation]}
  - {id: M12, text: "Are you kidding me?! This is the worst service I've ever had.", mood: angry, expect: [early_escalation]}
  - {id: M13, text: "What a joke. You people are useless.", mood: angry, expect: [early_escalation]}
  - {id: M14, text: "Forget it. I'm never ordering from you again.", mood: angry, expect: [early_escalation]}
  - {id: M15, text: "Fine. I'll shop elsewhere. Thanks.", mood: concerned, expect: [early_escalation], hard: true}
  - {id: M16, text: "Never mind, I'll just buy it from another store.", mood: calm, expect: [early_escalation], hard: true}
  - {id: M17, text: "I give up. This is going nowhere.", mood: concerned, expect: [early_escalation]}
  - {id: M18, text: "Oh great, another week of waiting. Fantastic service.", mood: concerned, expect: [acknowledge, early_escalation], hard: true}
  # M19 relabelled 2026-11-15, after the fifth run, by a second reader: "not calm". It was calm / [none].
  - {id: M19, text: "Can you check on my order of the book I HATE EVERYTHING ABOUT YOU?", mood: concerned, expect: [acknowledge, early_escalation], hard: true}
  - {id: M20, text: "The carrier was a nightmare and I was furious, but the book is here now. Thanks for sorting it.", mood: calm, expect: [none], hard: true}
  - {id: M21, text: "I'd like to return the novel Damn Fine Mess. I changed my mind.", mood: calm, expect: [none], hard: true}
  - {id: M22, text: "I don't want to give up on this book. Can I exchange it for the paperback?", mood: calm, expect: [none], hard: true}
  - {id: M23, text: "Perfect, that's sorted. Thank you!", mood: calm, expect: [none]}
  - {id: M24, text: "This is the third time I am asking. Where is my refund?", mood: concerned, expect: [acknowledge, early_escalation], hard: true}
