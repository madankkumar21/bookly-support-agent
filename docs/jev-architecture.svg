<text class="lg" x="680" y="784">Jev is not asked</text>
<text class="lg" x="1180" y="784" text-anchor="end">latest run: 0 wrong refunds in 57 conversations</text>
<text class="lg" x="20" y="808">Jev judges language · code decides and owns every write · Sonnet words every reply</text>
