<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" role="img" aria-label="Bookly agent with Jev: per message, Jev answers typed questions, code decides with truth tables and owns every write, Sonnet words every reply; a store and a clock carry follow-ups and the last contact across days.">
<style>
.zone{fill:#f7f9fc;stroke:#b9c3d1;stroke-width:1.2;stroke-dasharray:6 4}
.zl{fill:#5b6575;font:600 11px Menlo,Consolas,"DejaVu Sans Mono",monospace;letter-spacing:.08em}
.zn{fill:#5b6575;font:11px Menlo,Consolas,"DejaVu Sans Mono",monospace}
.node{fill:#ffffff;stroke:#141b26;stroke-width:1.3}
.node.hi{fill:#fff4c7}
.node.dsh{stroke-dasharray:5 4;stroke:#7a8494}
.nt{fill:#141b26;font:600 13.5px Helvetica,Arial,sans-serif}
.ns{fill:#5b6575;font:11px Menlo,Consolas,"DejaVu Sans Mono",monospace}
.pillnode{fill:#141b26}.pilltext{fill:#ffffff;font:600 12.5px Helvetica,Arial,sans-serif}
.e{fill:none;stroke-width:2}.ew{stroke:#2f5bd3}.ef{stroke:#c9581a}.ea{stroke:#16824f}.ep{stroke:#7a8494}
.bc{stroke:#ffffff;stroke-width:1.5}.bcw{fill:#2f5bd3}.bcf{fill:#c9581a}.bca{fill:#16824f}
.bt{fill:#ffffff;font:600 10.5px Menlo,Consolas,"DejaVu Sans Mono",monospace}
.el{font:11px Menlo,Consolas,"DejaVu Sans Mono",monospace}.elw{fill:#2f5bd3}.elf{fill:#c9581a}.ela{fill:#16824f}.elp{fill:#7a8494}
.mk-w{fill:#2f5bd3}.mk-f{fill:#c9581a}.mk-a{fill:#16824f}.mk-p{fill:#7a8494}
.lg{fill:#5b6575;font:12px Menlo,Consolas,"DejaVu Sans Mono",monospace}
</style>
<rect width="1200" height="820" fill="#ffffff"/>
<defs>
<marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="mk-w"/></marker>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="mk-f"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="mk-a"/></marker>
<marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" class="mk-p"/></marker>
</defs>
<rect class="zone" x="20" y="30" width="340" height="440" rx="10"/>
<text class="zl" x="34" y="50">AGENT · bookly/agent.py</text>
<rect class="zone" x="400" y="30" width="360" height="440" rx="10"/>
<text class="zl" x="414" y="50">JEV · DECISION MODEL · jev.py</text>
<rect class="zone" x="800" y="30" width="380" height="440" rx="10"/>
<text class="zl" x="814" y="50">CODE DECIDES · judgments.py</text>
<rect class="zone" x="20" y="520" width="340" height="200" rx="10"/>
<text class="zl" x="34" y="540">DAYS LATER</text>
<rect class="zone" x="400" y="520" width="780" height="200" rx="10"/>
<text class="zl" x="414" y="540">STORE · store.py</text>
<text class="zn" x="420" y="76">typed questions in, probabilities out</text>
<text class="zn" x="420" y="92">writes no text, keeps nothing between calls</text>
<text class="zn" x="820" y="76">reads each probability through a truth table</text>
<text class="zn" x="820" y="92">owns every write and every refund</text>
<rect class="pillnode" x="40" y="58" width="300" height="32" rx="16.0"/>
<text class="pilltext" x="190.0" y="78.5" text-anchor="middle">customer message</text>
<rect class="node" x="40" y="112" width="300" height="70" rx="8"/>
<text class="nt" x="54" y="134">follow-up check</text>
<text class="ns" x="54" y="152">before the model sees the message</text>
<text class="ns" x="54" y="167">only if a follow-up is waiting</text>
<rect class="node hi" x="40" y="202" width="300" height="90" rx="8"/>
<text class="nt" x="54" y="224">Sonnet 5.5</text>
<text class="ns" x="54" y="242">follows the procedures, picks tools</text>
<text class="ns" x="54" y="257">words every reply</text>
<text class="ns" x="54" y="272">calls the recommend tool</text>
<rect class="node" x="40" y="312" width="300" height="70" rx="8"/>
<text class="nt" x="54" y="334">remember</text>
<text class="ns" x="54" y="352">after the reply, once one email</text>
<text class="ns" x="54" y="367">is verified</text>
<rect class="node" x="40" y="402" width="300" height="52" rx="8"/>
<text class="nt" x="54" y="424">refund gate · gate.py</text>
<text class="ns" x="54" y="442">verified order, policy, cap, confirmation</text>
<rect class="node" x="420" y="112" width="320" height="70" rx="8"/>
<text class="nt" x="434" y="134">follow_up</text>
<text class="ns" x="434" y="152">arrived?  not arrived?</text>
<text class="ns" x="434" y="167">two yes/no questions</text>
<rect class="node" x="420" y="202" width="320" height="90" rx="8"/>
<text class="nt" x="434" y="224">recommend</text>
<text class="ns" x="434" y="242">would a reader of her books</text>
<text class="ns" x="434" y="257">also choose this candidate?</text>
<text class="ns" x="434" y="272">one question per candidate</text>
<rect class="node" x="420" y="312" width="320" height="70" rx="8"/>
<text class="nt" x="434" y="334">remember</text>
<text class="ns" x="434" y="352">lasting taste per genre · special treatment</text>
<text class="ns" x="434" y="367">mood score · gave up · said solved</text>
<rect class="node dsh" x="420" y="402" width="320" height="52" rx="8"/>
<text class="nt" x="434" y="424">not asked</text>
<text class="ns" x="434" y="442">refunds, eligibility, amounts, dates</text>
<rect class="node" x="820" y="112" width="340" height="70" rx="8"/>
<text class="nt" x="834" y="134">decide_follow_up</text>
<text class="ns" x="834" y="152">close · ask · escalate · no change</text>
<text class="ns" x="834" y="167">close needs 0.85; a second ask escalates</text>
<rect class="node" x="820" y="202" width="340" height="90" rx="8"/>
<text class="nt" x="834" y="224">decide_recommend</text>
<text class="ns" x="834" y="242">filters stock, owned and disliked</text>
<text class="ns" x="834" y="257">genres, then ranks the top three</text>
<text class="ns" x="834" y="272">recommend.py</text>
<rect class="node" x="820" y="312" width="340" height="70" rx="8"/>
<text class="nt" x="834" y="334">decide_remember · decide_mood</text>
<text class="ns" x="834" y="352">saves genre keys from a fixed list</text>
<text class="ns" x="834" y="367">nothing saved on special treatment</text>
<text class="zn" x="820" y="418">every table has an unsettled row,</text>
<text class="zn" x="820" y="433">so 215 tests run with no model</text>
<rect class="node" x="40" y="552" width="300" height="72" rx="8"/>
<text class="nt" x="54" y="574">clock · missions.run_due</text>
<text class="ns" x="54" y="592">sends the follow-ups that are due</text>
<text class="ns" x="54" y="607">14 days, no reply: close or ticket</text>
<rect class="node" x="40" y="640" width="300" height="64" rx="8"/>
<text class="nt" x="54" y="662">next visit · contact.on_return</text>
<text class="ns" x="54" y="680">code: how the last contact ended</text>
<text class="ns" x="54" y="695">plus the mood Jev read</text>
<rect class="node" x="420" y="552" width="230" height="90" rx="8"/>
<text class="nt" x="434" y="574">contact.py</text>
<text class="ns" x="434" y="592">how the last contact ended:</text>
<text class="ns" x="434" y="607">refusal, ticket, mood</text>
<rect class="node" x="670" y="552" width="230" height="90" rx="8"/>
<text class="nt" x="684" y="574">memory.py</text>
<text class="ns" x="684" y="592">reading tastes as genre</text>
<text class="ns" x="684" y="607">keys, never the customer's</text>
<text class="ns" x="684" y="622">own words</text>
<rect class="node" x="920" y="552" width="240" height="90" rx="8"/>
<text class="nt" x="934" y="574">missions.py</text>
<text class="ns" x="934" y="592">follow-ups: refund check,</text>
<text class="ns" x="934" y="607">lost package; due dates</text>
<text class="ns" x="934" y="622">and status in code</text>
<text class="zn" x="420" y="664">outlives one conversation; held in memory, so it survives a new chat, not a restart</text>
